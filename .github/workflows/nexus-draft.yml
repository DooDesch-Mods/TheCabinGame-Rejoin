name: Update unpublished Nexus file
on:
  workflow_dispatch:
    inputs:
      upload:
        description: Update the unpublished file after checking its current state
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: nexus-${{ github.repository }}
  cancel-in-progress: false
jobs:
  draft:
    runs-on: ubuntu-latest
    env:
      NEXUS_MOD_ID: ${{ vars.NEXUS_MOD_ID }}
      NEXUS_FILE_GROUP_ID: ${{ vars.NEXUS_FILE_GROUP_ID }}
      NEXUS_GAME_SCOPED_ID: ${{ vars.NEXUS_GAME_SCOPED_ID }}
      NEXUSMODS_API_KEY: ${{ secrets.NEXUSMODS_API_KEY }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m unittest discover -s tests -v
      - name: Build current candidate or require game acceptance
        run: python tools/nexus_draft.py build
      - name: Update authorized early development page text
        if: inputs.upload
        run: python tools/nexus_page.py --execute
      - name: Guard unpublished parent and capture file requirements
        id: target
        run: python tools/nexus_draft.py preflight
      - name: Update the existing unpublished file
        id: nexus
        if: steps.target.outputs.ready == 'true' && inputs.upload
        uses: Nexus-Mods/upload-action@c96019556046053aa26044b44396cd38929daf23
        with:
          api_key: ${{ secrets.NEXUSMODS_API_KEY }}
          file_id: ${{ vars.NEXUS_FILE_GROUP_ID }}
          mod_id: ${{ vars.NEXUS_MOD_ID }}
          filename: ${{ steps.target.outputs.asset }}
          version: ${{ steps.target.outputs.version }}
          display_name: ${{ steps.target.outputs.display_name }}
          description: Rejoin is in an early development state. A complete test with four different Steam accounts has not yet been performed.
          category: main
          allow_mod_manager_download: false
          primary_mod_manager_download: false
          show_requirements_pop_up: true
          archive_existing_version: true
          update_mod_version: false
      - name: Verify uploaded file and preserve file-to-file requirements
        if: steps.target.outputs.ready == 'false' || inputs.upload
        env:
          NEXUS_VERSION_ID: ${{ steps.nexus.outputs.version_id }}
        run: python tools/nexus_draft.py verify
      - name: Save update receipt
        if: always()
        uses: actions/upload-artifact@v6.0.0
        with:
          name: nexus-draft-receipt
          path: |
            dist/nexus-draft.json
            dist/nexus-page.json
          if-no-files-found: warn
